<main style="max-width: 400px; margin: 100px auto; padding: 24px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: var(--mat-sys-surface);">

  @if (mode() === 'login') {
    <h1 style="margin-top: 0;">Sign In</h1>

    @if (errorMessage()) {
      <div style="background-color: #fdecea; color: #b71c1c; padding: 12px; margin-bottom: 16px; border-radius: 4px; border: 1px solid #f44336;">
        {{ errorMessage() }}
      </div>
    }

    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email</label>
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 24px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500;">Password</label>
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <button (click)="onLogin()" style="width: 100%; padding: 12px; background-color: #0d47a1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Login
    </button>

    <div style="text-align: center; margin-top: 16px;">
      <a routerLink="/forgot-password" style="color: #0d47a1; text-decoration: none; font-size: 14px;">Forgot password?</a>
    </div>

    <div style="text-align: center; margin-top: 12px; font-size: 14px;">
      Don't have an account?
      <button (click)="mode.set('register')" style="background: none; border: none; color: #0d47a1; cursor: pointer; font-weight: bold; font-size: 14px;">Register</button>
    </div>
  }

  @if (mode() === 'register') {
    <h1 style="margin-top: 0;">Create Account</h1>

    @if (errorMessage()) {
      <div style="background-color: #fdecea; color: #b71c1c; padding: 12px; margin-bottom: 16px; border-radius: 4px; border: 1px solid #f44336;">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div style="background-color: #e8f5e9; color: #1b5e20; padding: 12px; margin-bottom: 16px; border-radius: 4px; border: 1px solid #4caf50;">
        {{ successMessage() }}
      </div>
    }

    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500;">Name</label>
      <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500;">Age</label>
      <input type="number" [ngModel]="age()" (ngModelChange)="age.set(+$event)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email</label>
      <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 24px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 500;">Password</label>
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    </div>

    <button (click)="onRegister()" style="width: 100%; padding: 12px; background-color: #0d47a1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Create Account
    </button>

    <div style="text-align: center; margin-top: 16px; font-size: 14px;">
      Already have an account?
      <button (click)="mode.set('login')" style="background: none; border: none; color: #0d47a1; cursor: pointer; font-weight: bold; font-size: 14px;">Sign In</button>
    </div>
  }

</main>

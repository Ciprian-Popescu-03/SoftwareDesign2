<mat-toolbar color="primary" style="display: flex; justify-content: space-between;">
  <div>
    <span>Product Catalog</span>
    @if (isAdmin) {
      <button mat-button style="margin-left: 20px; color: white;" (click)="goToPeople()">
        <mat-icon>group</mat-icon> People
      </button>
    }
  </div>
  <button mat-button style="color: white;" (click)="logout()">
    <mat-icon>logout</mat-icon> Logout
  </button>
</mat-toolbar>

<main style="max-width: 900px; margin: 32px auto; padding: 0 16px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h1 style="margin: 0;">Manage Products</h1>
    @if (isAdmin) {
      <button mat-flat-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon> New Product
      </button>
    }
  </div>

  <div style="border: 1px solid #e0e0e0; border-radius: 4px; overflow: hidden;">
    <table mat-table [dataSource]="filteredProducts()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let product"> {{product.name}} </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let product"> ${{product.price}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let product">
          <button mat-icon-button color="primary" (click)="openEditDialog(product)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="deleteProduct(product.id)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</main>
